<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Two overlapping speech bubbles, each holding lines of text">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset="1" stop-color="#eaeaec"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- the first voice -->
  <g>
    <path d="M150 118 h280 a14 14 0 0 1 14 14 v150 a14 14 0 0 1 -14 14 h-206 l-46 40 v-40 h-28
             a14 14 0 0 1 -14 -14 v-150 a14 14 0 0 1 14 -14 z"
          fill="#f5f5f7" stroke="#16161d" stroke-width="2" opacity="0.9"/>
    <g stroke="#16161d" stroke-width="4" stroke-linecap="round" opacity="0.28">
      <path d="M186 170 H400"/>
      <path d="M186 206 H372"/>
      <path d="M186 242 H330"/>
    </g>
  </g>

  <!-- the second voice, answering -->
  <g>
    <path d="M370 216 h280 a14 14 0 0 1 14 14 v150 a14 14 0 0 1 -14 14 h-28 v40 l-46 -40 h-206
             a14 14 0 0 1 -14 -14 v-150 a14 14 0 0 1 14 -14 z"
          fill="#f5f5f7" stroke="#3f6fb5" stroke-width="2"/>
    <g stroke="#3f6fb5" stroke-width="4" stroke-linecap="round" opacity="0.45">
      <path d="M406 268 H620"/>
      <path d="M406 304 H592"/>
      <path d="M406 340 H550"/>
    </g>
  </g>
</svg>
