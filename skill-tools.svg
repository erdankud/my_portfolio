<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="A grid of modular tiles, one of them marked with a check">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset="1" stop-color="#eaeaec"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- a toolkit as a modular grid: 4 across, 3 down -->
  <g stroke="#16161d" stroke-width="2" fill="none" opacity="0.85">
    <rect x="184" y="91"  width="90" height="90" rx="12"/>
    <rect x="298" y="91"  width="90" height="90" rx="12"/>
    <rect x="412" y="91"  width="90" height="90" rx="12"/>
    <rect x="526" y="91"  width="90" height="90" rx="12"/>

    <rect x="184" y="205" width="90" height="90" rx="12"/>
    <rect x="412" y="205" width="90" height="90" rx="12"/>
    <rect x="526" y="205" width="90" height="90" rx="12"/>

    <rect x="184" y="319" width="90" height="90" rx="12"/>
    <rect x="298" y="319" width="90" height="90" rx="12"/>
    <rect x="526" y="319" width="90" height="90" rx="12"/>
  </g>

  <!-- tiles that are filled in -->
  <g fill="#16161d" opacity="0.07">
    <rect x="298" y="91"  width="90" height="90" rx="12"/>
    <rect x="526" y="205" width="90" height="90" rx="12"/>
    <rect x="184" y="319" width="90" height="90" rx="12"/>
  </g>

  <!-- the certification -->
  <rect x="298" y="205" width="90" height="90" rx="12" fill="#3f6fb5"/>
  <path d="M320 250 L336 266 L366 234" fill="none" stroke="#ffffff" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- an empty slot, for what comes next -->
  <rect x="412" y="319" width="90" height="90" rx="12" fill="none" stroke="#c3c3cb"
        stroke-width="2" stroke-dasharray="6 8"/>
</svg>
