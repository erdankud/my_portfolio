<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="A route of connected points rising from left to right">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset="1" stop-color="#eaeaec"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- baseline -->
  <path d="M110 400 H690" stroke="#d3d3da" stroke-width="1.5" stroke-linecap="round"/>

  <!-- the route -->
  <path d="M155 348 L280 288 L405 305 L530 216 L655 158"
        fill="none" stroke="#16161d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>

  <!-- drop lines to the baseline -->
  <g stroke="#c9c9d0" stroke-width="1.5" stroke-dasharray="3 7" stroke-linecap="round">
    <path d="M155 348 V400"/>
    <path d="M280 288 V400"/>
    <path d="M405 305 V400"/>
    <path d="M530 216 V400"/>
  </g>

  <!-- stops along the route -->
  <g fill="#f5f5f7" stroke="#16161d" stroke-width="2">
    <circle cx="155" cy="348" r="9"/>
    <circle cx="280" cy="288" r="9"/>
    <circle cx="405" cy="305" r="9"/>
    <circle cx="530" cy="216" r="9"/>
  </g>

  <!-- where it is heading -->
  <circle cx="655" cy="158" r="22" fill="none" stroke="#3f6fb5" stroke-width="1.5" opacity="0.35"/>
  <circle cx="655" cy="158" r="10" fill="#3f6fb5"/>
</svg>
