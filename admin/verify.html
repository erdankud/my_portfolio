<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Template check</title></head>
<body>
<pre id="out">running…</pre>
<script type="module">
import { buildAll } from "./templates.js";

const out = document.getElementById("out");
const lines = [];

try {
  const content = await (await fetch("../content.json")).json();
  const built = buildAll(content);
  let failures = 0;

  for (const page of Object.keys(built)) {
    if (page.endsWith(".json")) continue;

    const res = await fetch("../" + page);
    if (!res.ok) {
      failures++;
      lines.push("MISSING  " + page + "  (generated, but not in the repository)");
      continue;
    }
    const expected = await res.text();
    const actual = built[page];

    if (expected === actual) {
      lines.push("ok       " + page);
      continue;
    }
    failures++;
    lines.push("DIFF     " + page);
    const a = expected.split("\n");
    const b = actual.split("\n");
    let shown = 0;
    for (let i = 0; i < Math.max(a.length, b.length) && shown < 8; i++) {
      if (a[i] !== b[i]) {
        shown++;
        lines.push("  line " + (i + 1));
        lines.push("    published: " + JSON.stringify(a[i] ?? "(missing)"));
        lines.push("    generated: " + JSON.stringify(b[i] ?? "(missing)"));
      }
    }
  }

  lines.push("");
  lines.push(
    failures
      ? failures + " page(s) differ."
      : "RESULT: all " + (Object.keys(built).length - 1) + " pages reproduce exactly."
  );
} catch (err) {
  lines.push("ERROR: " + (err && err.message ? err.message : String(err)));
}

out.textContent = lines.join("\n");
</script>
</body>
</html>
